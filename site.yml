---
- name: Install and configure Vector
  hosts: all
  become: true
  vars:
    vector_version: "0.37.0"
    vector_install_dir: "/opt/vector"
    vector_config_dir: "/etc/vector"
    vector_user: "vector"
    vector_group: "vector"

  handlers:
    - name: Restart Vector
      ansible.builtin.systemd:
        name: vector
        state: restarted
        daemon_reload: true

  tasks:
    - name: Create vector user
      ansible.builtin.user:
        name: "{{ vector_user }}"
        system: true
        create_home: false
        state: present
      tags: install

    - name: Create vector directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ vector_user }}"
        group: "{{ vector_group }}"
        mode: '0755'
      loop:
        - "{{ vector_install_dir }}"
        - "{{ vector_config_dir }}"
        - "/var/log/vector"
      tags: install

    - name: Download Vector
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/vector-{{ vector_version }}.tar.gz"
        timeout: 60
        mode: '0644'
      tags: download

    - name: Extract Vector archive
      ansible.builtin.unarchive:
        src: "/tmp/vector-{{ vector_version }}.tar.gz"
        dest: "/tmp/"
        remote_src: true
        creates: "/tmp/vector-x86_64-unknown-linux-gnu"
      tags: extract

    - name: Install Vector binary
      ansible.builtin.copy:
        src: "/tmp/vector-x86_64-unknown-linux-gnu/bin/vector"
        dest: "/usr/local/bin/vector"
        owner: root
        group: root
        mode: '0755'
        remote_src: true
      tags: install

    - name: Verify Vector installation
      ansible.builtin.command:
        cmd: "/usr/local/bin/vector --version"
      register: vector_version_check
      changed_when: false
      tags: install

    - name: Show Vector version
      ansible.builtin.debug:
        var: vector_version_check.stdout
      tags: install

    - name: Deploy Vector configuration
      ansible.builtin.template:
        src: vector.j2
        dest: "{{ vector_config_dir }}/vector.toml"
        owner: "{{ vector_user }}"
        group: "{{ vector_group }}"
        mode: '0644'
      notify: Restart Vector
      tags: config

    - name: Create systemd service file
      ansible.builtin.template:
        src: vector.service.j2
        dest: "/etc/systemd/system/vector.service"
        mode: '0644'
      notify: Restart Vector
      tags: config

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      tags: service

    - name: Enable and start Vector service
      ansible.builtin.systemd:
        name: vector
        enabled: true
        state: started
      tags: service
